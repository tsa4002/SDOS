<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Six Degrees of Sound — SDOS</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/frontpage_stylesheet.css?v=20261023">
</head>
<body>
  <div class="page">
    <a href="/" class="home-link" aria-label="Return to SDOS home">
      <h1> Six Degrees of Sound </h1>
    </a>
    <p>Link two artists using overlapping collaborations</p>


    <form id="connectionForm">
      <div class="input-container">
        <!-- Artist 1 -->
        <div class="input-wrapper">
          <input id="artist1" type="text" placeholder="Artist 1" autocomplete="off" />
          <input id="artist1_id" type="hidden" name="artist1_id" />
        </div>

      <!-- Link icon -->
       <div class="link-icon" id="linkIconWrapper">
        <object 
          id="linkIcon" 
          data="/static/images/loading.svg" 
          type="image/svg+xml"
          class="static-icon"
          width="44"
          height="44"
        ></object>
      </div>
        
      
        <!-- Artist 2 -->
        <div class="input-wrapper">
          <input id="artist2" type="text" placeholder="Artist 2" autocomplete="off" />
          <input id="artist2_id" type="hidden" name="artist2_id" />
        </div>
      </div>

      <div class="button-container">
        <button id="findBtn" type="submit">Find Connection</button>
      </div>
    </form>
    <div id="results"></div>
  </div>

  <script src="/static/scripts/find_connection.js?v=20261023"></script>
</body>
</html>
