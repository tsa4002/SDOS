<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Six Degrees of Sound — SDOS</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/frontpage_stylesheet.css?v=20261023b">
</head>
<body>
  <div class="page">
    <a href="/" class="home-link" aria-label="Return to SDOS home">
      <h1>Six Degrees of Sound</h1>
    </a>
    <p>Link two artists using overlapping collaborations</p>

    <form id="connectionForm">
      <div class="input-container">
        <!-- Artist 1 -->
        <div class="input-wrapper">
          <input id="artist1" type="text" placeholder="Artist 1" aria-label="Artist 1" autocomplete="off" />
          <input id="artist1_id" type="hidden" name="artist1_id" />
        </div>

        <!-- Link icon (gradient is animated by JS while loading) -->
        <div class="link-icon" id="linkIconWrapper">
          <svg
            id="linkIcon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 80 40"
            width="44"
            height="44"
            aria-hidden="true"
          >
              <defs>
                <linearGradient id="flowBlueGradient" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#52aaed"/>
                  <stop offset="100%" stop-color="#5965e9"/>
                </linearGradient>

                <linearGradient id="flowRedGradient" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#f05260"/>
                  <stop offset="100%" stop-color="#e14141"/>
                </linearGradient>

                <path
                  id="flowTrack"
                  d="M40 10 H67 A8 8 0 0 1 75 18 V22 A8 8 0 0 1 67 30 H13 A8 8 0 0 1 5 22 V18 A8 8 0 0 1 13 10 H40"
                  pathLength="100"
                />
              </defs>

              <!-- Fixed outline -->
              <use
                href="#flowTrack"
                fill="none"
                stroke="#e9edf2"
                stroke-width="6"
              />

              <!-- Blue segment, initially on the left -->
              <use
                id="flowBlueSegment"
                href="#flowTrack"
                fill="none"
                stroke="url(#flowBlueGradient)"
                stroke-width="6"
                stroke-linecap="butt"
                stroke-dasharray="47 53"
                stroke-dashoffset="-50"
              />

              <!-- Red segment, initially on the right -->
              <use
                id="flowRedSegment"
                href="#flowTrack"
                fill="none"
                stroke="url(#flowRedGradient)"
                stroke-width="6"
                stroke-linecap="butt"
                stroke-dasharray="47 53"
                stroke-dashoffset="0"
              />
          </svg>
        </div>

        <!-- Artist 2 -->
        <div class="input-wrapper">
          <input id="artist2" type="text" placeholder="Artist 2" aria-label="Artist 2" autocomplete="off" />
          <input id="artist2_id" type="hidden" name="artist2_id" />
        </div>
      </div>

      <div class="button-container">
        <button id="findBtn" type="submit">Find Connection</button>
      </div>
    </form>

    <div id="results"></div>
  </div>
  <script src="/static/scripts/find_connection.js?v=20261025a"></script>
</body>
</html>
